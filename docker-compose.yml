services:
  ecotrack-api:
    container_name: ecotrack-api
    build:
      context: .
      dockerfile: Dockerfile
      args:
        BUILD_CONFIGURATION: Release
    image: ecotrack-api:local

    ports:
      - "${API_PORT:-8080}:8080"

    environment:
      ASPNETCORE_ENVIRONMENT: "${ASPNETCORE_ENVIRONMENT:-Development}"
      ASPNETCORE_URLS: "http://+:8080"

      ConnectionStrings__DatabaseConnection: >-
        Data Source=(DESCRIPTION=(ADDRESS_LIST=(ADDRESS=(PROTOCOL=TCP)(HOST=${ORACLE_HOST})(PORT=${ORACLE_PORT:-1521})))(CONNECT_DATA=(SID=${ORACLE_SID:-orcl})));Persist Security Info=True;User ID=${ORACLE_USER};Password=${ORACLE_PASSWORD};Pooling=True;Connection Timeout=60;

      Jwt__SecretKey: "${JWT_SECRET_KEY}"
      Jwt__Issuer: "${JWT_ISSUER:-EcoTrack}"
      Jwt__Audience: "${JWT_AUDIENCE:-EcoTrackUsers}"

    volumes:
      - ecotrack-dataprotection:/home/app/.aspnet/DataProtection-Keys

    networks:
      - ecotrack-network

    restart: unless-stopped

volumes:
  ecotrack-dataprotection:
    name: ecotrack-dataprotection

networks:
  ecotrack-network:
    name: ecotrack-network
    driver: bridge